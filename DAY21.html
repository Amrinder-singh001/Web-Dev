<!-- All about Range and tax area in an HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range in Html</title>
</head>
<body>
    <h3>About Range in HTML</h3>
 <form action="/server">
    <label for="val">Choose your volume level</label>
      <br>
        <input type="range" id="val" name="Val" min="0" max="100" value="1" step="1">
       <button>Submit</button>
 </form>
    
    <form action="/server">
    <h3>About tax area in HTML</h3>
    <label for="tax"> Enter your feedback </label>
    <textarea id="tax" colspan = 5 rowspan = 2 name="feedback" val=""></textarea>
    <button>Submit</button>
    </form>
</body>
</html>
