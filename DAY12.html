<!-- All About Semantic Tags in HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags</title>
</head>
<body>

    <header>This is the header tag of my website
        <nav>
          <ul> 
            <li><a href="/About">About Us</a></li>
            <li><a href="/contact">Contact At</a></li>
          </ul>
        </nav>
    </header>
    <main>This tag can show my Main content of the website</main>
    <section>This is a Section Tag for my website</section>
    <article>This is a Article Tag for my website</article>
    <aside>This is a Aside tag for my website</aside>
    <footer>This is the Footer of my website</footer>

</body>
</html>
