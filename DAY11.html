 <!-- All About the Superscript and Subscript Tags in HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sup and sub</title>
</head>
<body>
    <h4>Examples of supscript tags in HTML :)</h4>
    <P>A<sup>2</sup> + B<sup>2</sup> + = c<sup>2</sup></P>
    <p><i>In the square fo 2 = 4 the power <sup>(2)</sup> is a Superscript tag(sup)</i></p>
    <p>(2)<sup>2</sup> = 4 </p>

    <hr>    <!-- This is the Horizontal ruler tag used to add line to seprate the content in HTML -->
     
    <h4>Examples of subscript tags in HTML :)</h4>
    <p><i>In H2O the 2 is a Subscript tag(sub)</i></p>
    <p>H<sub>2</sub>O</p>
    <p>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></p>
</body>
</html>
