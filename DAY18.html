<!-- All about checkbox in HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkbox in HTML</title>
</head>
<body>
    <input type="checkbox" name="age" id="age">
    <label for="age">I am a 18+</label>

    <form action="/server">
        <input type="checkbox" name="age" id="age">
    <label for="age">I am a Adult</label>

    <button type="submit">Submit</button>
    </form>
</body>
</html>
