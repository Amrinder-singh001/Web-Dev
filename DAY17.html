<!-- All about buttons in html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons in html</title>
</head>
<body>
<h2>This is all about Buttons tags in html</h2>
    <form action="/Server">
        <input type="text" placeholder="username">
        <button>Submit Here!</button>
        <button type = "reset">Button type 3(Reset button)</button>
    </form>

    <h2>Here, is the different different types of Button is :)</h2>
    <input type="password" placeholder="password">
    <button type = "button"> Button type 1</button>
    <button type = "Submit"> Button type 2</button>
    <button type = "reset"> Button type 3</button>  <!--Ye reset nhi krega ktyuno form ke bahr hei-->

    <!--Thier are so many diff diff types of buttons are available-->

    <h2>Buttons through Input Elememts without button element but through Input</h2>
    <form action = "/form submited">
        <input type="button" value ="click me :)">    <!--isse form sunbmit nhi hoga kyunki type button hei -->
        <input type="submit">         <!--isse form sunbmit hoga kyunki type submit hei -->
    </form>
    
</body>
</html>
