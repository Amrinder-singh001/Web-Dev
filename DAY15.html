<!-- All Abouts Tablels in HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabels -in HTLML </title>
</head>
<body>
    <h3>Concept of Tabels in HTML</h3>
    <table border="black">
        <caption>Food Caption 🥯🧈</caption>
        
       <!--This is the header of table tag--> 
        <thead>
            <tr>
                <th>ITEM</th>
                <th>PRICE</th>
            </tr>
        </thead>

      <!--This is the Body of table tag-->  
       <tbody>
        <tr>
            <td>Apple Frooti🧃</td>
            <td>50rs~</td>
        </tr>

        <tr>
            <td>Pizza🍕</td>
            <td>80rs~</td>
        </tr>

        <tr>
            <td>Burger🍔</td>
            <td>90rs~</td>
        </tr>
       </tbody>
    </table>

    
    <h3>All About Rowspan and Colspan in HTML</h3>
    <table border="black">
        <caption>Food Menu</caption>
        <thead>
           <tr>
            <th rowspan = "2"> ITEM </th>
            <th colspan= "2" > PRICE </th>    <!--Colspan and Rowspan : hm apne colmns ya rows ko kitne sub colmns ya rows tk lei jana chate hein --> 
           </tr> 

            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Fruti</td>
                <td>10</td>
                <td>0.12</td>
            </tr>
            <tr>
                <td>samosa</td>
                <td>20</td>
                <td>0.25</td>
            </tr>
            <tr>
                <td>Burger</td>
                <td>75</td>
                <td>0.76</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
