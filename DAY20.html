<!-- ALL ABOUT SELECT TAG IN HTML -->
<!-- Display all the data in the form of option through option tag  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>select in html</title>
</head>
<body>
    <h3>About select tag in html</h3>
     <h2>select your passion</h2>
       
     <form action="/server">
        <div>
            <select name="Profession" id="prof">
                <option>select your passion</option>
                <option value="stu">Student</option>
                <option value="wor">Worker</option>
                <option value="vog">vlogger</option>
                <option value="spk">speaker</option>
                <option value="pro">promoter</option>
             </select>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
