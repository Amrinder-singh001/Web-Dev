<!-- HTML ENTITES IN HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML ENTITES</title>
</head>
<h3>Their are the some examles of the HTML ENTITES</h3>
<body>    
    <h1>  This is a &hearts; </h1>             <!--for hearts--> 
    <h1>  This is a &heartsuit; </h1>          <!-- for double arrow-->
    <h1>  This is a &lt; </h1>                 <!--for lesser then-->
    <h1>  This is a &gt; </h1>                 <!--for greater then-->
    <h1>  This is a &nbsp; Word </h1>              <!-- for spaces -->
    <h1>  This is a &amp;</h1>
    <h1>  This is a &star;</h1>
    
</body>
</html>
